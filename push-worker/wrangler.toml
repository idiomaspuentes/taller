# TAS push notifications: a Cloudflare Worker (free plan) with one KV namespace.
# Deploy steps are in README.md. Nothing here holds a secret: keys and the webhook
# secret are set with `wrangler secret put`.
name = "tas-push"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[vars]
# Door43 servers whose people may subscribe (comma separated, no trailing slash).
ALLOWED_HOSTS = "https://git.door43.org,https://qa.door43.org"
# Where the app is served (the notification opens it). Change it to the Pages address.
APP_URL = "https://taller.idiomaspuentes.org"
# Origins allowed to call /subscribe from a browser (comma separated).
ALLOWED_ORIGINS = "https://taller-b2h.pages.dev,https://taller.idiomaspuentes.org,http://localhost:5177"
# Contact for the push services, as a mailto: or https: address.
VAPID_SUBJECT = "https://qa.door43.org"

# Every two minutes: three notices of daily reminders at most each time, of those whose hour it is (see src/reminders.ts).
# One run in the free plan has 10 ms of processor and 50 calls; the whole team at 19:00 in one run would be cut off.
[triggers]
crons = ["*/2 * * * *"]

[[kv_namespaces]]
binding = "SUBSCRIPTIONS"
id = "9c62045505e448afbba28a88d1e98e77"
